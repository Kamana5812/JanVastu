name: Verify JanVastu
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: janvastu
          POSTGRES_PASSWORD: local-test-owner
          POSTGRES_DB: janvastu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U janvastu -d janvastu_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://janvastu:local-test-owner@localhost:5432/janvastu_test
      RUNTIME_DB_PASSWORD: isolated-test-runtime-password
      APP_ENV: demo
      MOCK_OTP_ENABLED: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m app.db.provision
      - run: python -m app.db.seed
      - run: pytest -q
        env:
          DATABASE_URL: postgresql+psycopg2://janvastu_api:isolated-test-runtime-password@localhost:5432/janvastu_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node scripts/check-i18n.mjs
      - run: npm run build
