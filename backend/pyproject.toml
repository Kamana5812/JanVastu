[tool.poetry]
name = "janvastu-backend"
version = "0.1.0"
description = "Backend for JanVastu, an AI-powered Digital Public Good"
authors = ["JanVastu Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = "^0.23.2"
sqlalchemy = "^2.0.23"
alembic = "^1.12.1"
psycopg2-binary = "^2.9.9"
geoalchemy2 = "^0.14.2"
pydantic-settings = "^2.0.3"
python-multipart = "^0.0.6"
redis = "^8.1.0"
httpx = "^0.28.1"
requests = "^2.34.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
ruff = "^0.1.5"
black = "^23.11.0"
mypy = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
