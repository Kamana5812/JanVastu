# Vercel hosts frontend/. Render hosts only the Docker API.
# Use a dedicated Neon/PostGIS database and a private S3-compatible bucket.
services:
  - type: web
    name: janvastu-api
    runtime: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    dockerCommand: python /app/app/hosted_start.py
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: JANVASTU_OWNER_DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: demo
      - key: MOCK_OTP_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: https://janvastu.vercel.app
      - key: FRONTEND_URL
        value: https://janvastu.vercel.app
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        value: janvastu-media
      - key: MINIO_SECURE
        value: "true"
      - key: MINIO_REGION
        value: us-east-2
